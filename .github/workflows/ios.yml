name: iOS app

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios
          VERSION="1.0.${{ github.run_number }}"
          set +e
          xcodebuild -project Board.xcodeproj -scheme Board -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          code=$?
          grep -E "error:" -A3 build.log | head -200
          tail -3 build.log
          exit $code

      - name: Package board.ipa
        run: |
          cd ios
          APP=build/Build/Products/Release-iphoneos/Board.app
          # ad-hoc signature that carries the entitlements (the app group the widget shares with the app);
          # SideStore / AltStore re-sign the app with your Apple ID when they install it
          codesign -f -s - --entitlements Widget/BoardWidget.entitlements "$APP/PlugIns/BoardWidget.appex"
          codesign -f -s - --entitlements App/Board.entitlements "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry board.ipa Payload
          python3 make_source.py board.ipa "1.0.${{ github.run_number }}" "${{ github.run_number }}" apps.json
          cp App/Assets.xcassets/AppIcon.appiconset/icon-1024.png icon.png
          ls -la board.ipa apps.json

      - uses: actions/upload-artifact@v4
        with:
          name: board-ios
          path: |
            ios/board.ipa
            ios/apps.json

      - name: Publish to the ios-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ios
          gh release view ios-latest >/dev/null 2>&1 || gh release create ios-latest --target "$GITHUB_SHA" --prerelease \
            --title "-board for iPhone (latest build)" \
            --notes "Install with SideStore or AltStore: add the source https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-latest/apps.json"
          gh release upload ios-latest board.ipa apps.json icon.png --clobber

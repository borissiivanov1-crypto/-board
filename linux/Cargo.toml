[package]
name = "board"
version = "1.0.0"
edition = "2021"
description = "-board: a live home-server dashboard and desktop widget for GNOME"
license = "MIT"
default-run = "board"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico", "bmp"] }
base64 = "0.22"
pangocairo = "0.21"
cairo-rs = { version = "0.21", features = ["png"] }
rand = "0.8"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
urlencoding = "2"

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
